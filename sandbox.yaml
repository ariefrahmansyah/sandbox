# Lima configuration for a disposable VM that runs an AI coding agent without
# supervision. The configuration assumes that code inside the VM is hostile.
# That code must not get to the files or credentials on the Mac, connect to
# the Mac or the LAN, or get root in the VM. It can connect to the internet.
#
# The configuration has three parts:
#   - sandbox.yaml (this file): the VM hardware and the Lima settings.
#   - provision.sh: the hardening script. Lima runs it as root at each boot.
#   - tools/*.sh: one install script for each tool, such as uv or gcloud.
#     The Makefile adds them when it builds the base VM.
#
# Do not start this file directly. Use the Makefile. It builds a base VM one
# time and then clones it for each task. See README.md.
#
# Root in the VM is available only from the Mac. To change the VM as root,
# change these files and rebuild the base VM with `make rebuild-base`.

minimumLimaVersion: 2.0.0

# Lima copies the image settings for Ubuntu 26.04 from its built-in template.
# This `base:` is a Lima template. It is not the base VM of the Makefile.
base:
  - template:_images/ubuntu-26.04

vmType: vz
cpus: 2
memory: "4GiB"
disk: "20GiB"

# Plain mode turns off mounts, port forwards, the guest agent, and containerd.
# Do not set `plain: false`. The VM then gets access to the Mac.
plain: true
nestedVirtualization: false
vmOpts:
  vz:
    rosetta:
      enabled: false

# The VM does not get the SSH agent or the SSH keys of the Mac.
ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false

# Lima sets a random sudo password and writes it to ~/password. provision.sh
# stops Lima from writing that file and locks the password, so sudo fails.
# Do not set `passwordlessSudo: true`. The agent then gets root.
user:
  passwordlessSudo: false

# provision.sh upgrades the packages one time, when it builds the base VM.
# If `upgradePackages` is true, Lima upgrades at each boot, because Lima
# changes the instance ID at each boot.
upgradePackages: false
propagateProxyEnv: false

# The Mac does not resolve DNS for the VM. provision.sh sets up DNS over TLS.
# Keep these resolvers the same as the resolvers in provision.sh.
hostResolver:
  enabled: false
dns:
  - 1.1.1.1
  - 9.9.9.9

provision:
  # Lima embeds provision.sh in the VM configuration when it creates the VM.
  - mode: system
    file: provision.sh
